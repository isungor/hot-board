name: Update Hot Board

on:
  push:
    branches: [main]
  schedule:
    # UTC 2:30 = 北京 10:30  |  UTC 7:00 = 北京 15:00
    - cron: '30 2 * * *'
    - cron: '0 7,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate HTML
        run: node generate.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "auto: update hot board $(date -u +%Y-%m-%d\ %H:%M)"
          git push
